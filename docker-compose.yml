version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: forensight
      POSTGRES_PASSWORD: forensight_password
      POSTGRES_DB: forensight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensight"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: 
      context: ./backend
    environment:
      - DATABASE_URL=postgresql://forensight:forensight_password@db:5432/forensight
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/storage:/app/storage

  worker:
    build:
      context: ./backend
    environment:
      - DATABASE_URL=postgresql://forensight:forensight_password@db:5432/forensight
      - REDIS_URL=redis://redis:6379/0
    command: celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
