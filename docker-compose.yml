version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forensight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-forensight}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensight"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: 
      context: ./backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-forensight}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-forensight}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=false
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost,http://localhost:5173}
      - CASE_EXPORT_SIGNING_PRIVATE_KEY=${CASE_EXPORT_SIGNING_PRIVATE_KEY:-}
      - ANALYSIS_JOB_STALE_AFTER_SECONDS=${ANALYSIS_JOB_STALE_AFTER_SECONDS:-900}
      - ANALYSIS_JOB_SOFT_TIME_LIMIT_SECONDS=${ANALYSIS_JOB_SOFT_TIME_LIMIT_SECONDS:-300}
      - ANALYSIS_JOB_TIME_LIMIT_SECONDS=${ANALYSIS_JOB_TIME_LIMIT_SECONDS:-330}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/storage:/app/storage

  worker:
    build:
      context: ./backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-forensight}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-forensight}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=false
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ANALYSIS_JOB_STALE_AFTER_SECONDS=${ANALYSIS_JOB_STALE_AFTER_SECONDS:-900}
      - ANALYSIS_JOB_SOFT_TIME_LIMIT_SECONDS=${ANALYSIS_JOB_SOFT_TIME_LIMIT_SECONDS:-300}
      - ANALYSIS_JOB_TIME_LIMIT_SECONDS=${ANALYSIS_JOB_TIME_LIMIT_SECONDS:-330}
    command: celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend/storage:/app/storage

  beat:
    build:
      context: ./backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-forensight}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-forensight}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ANALYSIS_JOB_STALE_AFTER_SECONDS=${ANALYSIS_JOB_STALE_AFTER_SECONDS:-900}
      - ANALYSIS_JOB_SOFT_TIME_LIMIT_SECONDS=${ANALYSIS_JOB_SOFT_TIME_LIMIT_SECONDS:-300}
      - ANALYSIS_JOB_TIME_LIMIT_SECONDS=${ANALYSIS_JOB_TIME_LIMIT_SECONDS:-330}
    command: celery -A app.core.celery_app beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend

volumes:
  pgdata:
