name: ForenSight CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-tests:
    name: Backend Tests & Security Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install System Dependencies for OpenCV / Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Complete Backend Pytest Suite
        run: |
          cd backend
          pytest tests/ -v

      - name: Run Dedicated Security Regression Tests
        run: |
          cd backend
          pytest tests/test_security_auth.py -v

  frontend-quality-and-build:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Validate TypeScript Types
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Production Frontend Bundle
        run: |
          cd frontend
          npm run build

  docker-compose-validation:
    name: Docker Compose Syntax & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker Compose Images
        run: |
          docker compose build

  postgres-redis-integration:
    name: Live PostgreSQL & Redis Celery Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: forensight
          POSTGRES_PASSWORD: forensight_password
          POSTGRES_DB: forensight
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Migrations against Live PostgreSQL
        env:
          DATABASE_URL: postgresql://forensight:forensight_password@localhost:5432/forensight
        run: |
          cd backend
          alembic upgrade head

      - name: Seed Demo Identities into PostgreSQL
        env:
          DATABASE_URL: postgresql://forensight:forensight_password@localhost:5432/forensight
        run: |
          cd backend
          python scripts/seed_demo.py

      - name: Run Integration Tests against PostgreSQL & Redis
        env:
          DATABASE_URL: postgresql://forensight:forensight_password@localhost:5432/forensight
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          REDIS_URL: redis://localhost:6379/0
          CELERY_TASK_ALWAYS_EAGER: "false"
        run: |
          cd backend
          # Launch background Celery worker against Redis
          celery -A app.core.celery_app worker --loglevel=info &
          WORKER_PID=$!
          sleep 3

          # Run backend tests
          pytest tests/ -v

          # Cleanup worker
          kill $WORKER_PID || true
