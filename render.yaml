services:
  # ForenSight Backend API (FastAPI + OpenCV)
  - type: web
    name: forensight-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: ForenSight
      - key: API_V1_STR
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: forensight-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: ALLOW_EPHEMERAL_LOCAL_STORAGE
        value: "true"
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_DIR
        value: /app/storage
      - key: BACKEND_CORS_ORIGINS
        value: "https://forensight-frontend.onrender.com,http://localhost:5173"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: MAX_UPLOAD_SIZE
        value: "10485760"

  # ForenSight Frontend (React + Vite)
  - type: web
    name: forensight-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        value: ""
    routes:
      - type: rewrite
        source: /api/*
        destination: https://forensight-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: forensight-db
    plan: free
    region: oregon
    databaseName: forensight
    user: forensight
