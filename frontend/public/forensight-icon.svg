<svg xmlns="http://www.w3.org/2000/svg" viewBox="21.5 21 60 60" fill="none">
  
    <defs>
      <!-- Squircle Rim Glow -->
      <linearGradient id="rim-grad_dark" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.75"/>
        <stop offset="35%" stop-color="#d97706" stop-opacity="0.3"/>
        <stop offset="70%" stop-color="#0284c7" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
      </linearGradient>

      <!-- Ambient soft inner glow -->
      <radialGradient id="top-left-glow_dark" cx="35" cy="30" r="45" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>

      <!-- Ivory / Champagne Metallic Gradient (Dark Mode) -->
      <linearGradient id="ivory-grad_dark" x1="24" y1="28" x2="65" y2="74" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="25%" stop-color="#ede7dc"/>
        <stop offset="60%" stop-color="#d8cebf"/>
        <stop offset="100%" stop-color="#baa995"/>
      </linearGradient>

      <!-- Obsidian Navy Ribbon Gradient (Light Mode) -->
      <linearGradient id="obsidian-ribbon-grad_dark" x1="24" y1="28" x2="65" y2="74" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#2a3d52"/>
        <stop offset="40%" stop-color="#1c2b3a"/>
        <stop offset="100%" stop-color="#141f2b"/>
      </linearGradient>

      <!-- Amber / Gold Quadrant Gradient -->
      <linearGradient id="gold-grad_dark" x1="36" y1="28" x2="65" y2="52" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="20%" stop-color="#fbbf24"/>
        <stop offset="55%" stop-color="#f59e0b"/>
        <stop offset="85%" stop-color="#d97706"/>
        <stop offset="100%" stop-color="#b45309"/>
      </linearGradient>

      <!-- Bottom-Left Under Bevel (Warm Amber Gold 3D Shelf) -->
      <linearGradient id="shelf-grad_dark" x1="24" y1="64" x2="43" y2="74" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#f59e0b"/>
        <stop offset="100%" stop-color="#78350f"/>
      </linearGradient>

      <!-- Pixel Fragment Gradient -->
      <linearGradient id="pixel-grad_dark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="30%" stop-color="#fbbf24"/>
        <stop offset="70%" stop-color="#f59e0b"/>
        <stop offset="100%" stop-color="#d97706"/>
      </linearGradient>

      <!-- Faceted Mountain - Sunny Light Face -->
      <linearGradient id="mtn-face-light_dark" x1="47.5" y1="47" x2="55" y2="57" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#f1f5f9"/>
        <stop offset="100%" stop-color="#94a3b8"/>
      </linearGradient>

      <!-- Faceted Mountain - Shadow Face -->
      <linearGradient id="mtn-face-shadow_dark" x1="47.5" y1="47" x2="42" y2="57" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#64748b"/>
        <stop offset="100%" stop-color="#334155"/>
      </linearGradient>
    </defs>
  
  <g id="forensight-symbol-dark">
    
    <!-- 1. Bottom-Left Under Bevel / Shelf (Warm Amber Gold 3D Foot) -->
    <path d="M 24 64 L 32.5 73.5 C 33 74 33.7 74 34.5 74 H 43.5 V 66.5 H 32 Z" fill="url(#shelf-grad_dark)" />

    <!-- 2. Main Ribbon Frame (Left Spine & Top Curve) -->
    <path d="
      M 37 28
      C 29.5 28 24 33.5 24 41
      V 64
      L 32.5 73.5
      C 33 74 33.7 74 34.5 74
      H 43.5
      V 66.5
      C 37.8 66.5 35.8 63.8 35.8 59
      V 42
      C 35.8 38.6 38.4 35.8 42 35.8
      H 44
      L 37 28 Z
    " fill="url(#ivory-grad_dark)" />

    <!-- 3. Lower Sweeping Horizon Ribbon (curving under aperture) -->
    <path d="
      M 64.5 56
      C 64.5 63.5 58.5 67 50.5 67
      H 35.8
      C 35.8 62.5 38.5 58.5 43.5 58.5
      H 51.5
      C 55 58.5 57 56.5 57 53.5
      V 50
      H 64.5
      V 56 Z
    " fill="url(#ivory-grad_dark)" />

    <!-- 4. Top-Right Golden Amber Quadrant Frame -->
    <path d="
      M 37 28
      H 57
      C 61.8 28 64.5 30.7 64.5 35.5
      V 47.5
      H 57.5
      V 35.8
      C 57.5 35.8 57 35.8 55 35.8
      H 42
      C 38.4 35.8 35.8 38.6 35.8 42
      L 37 28 Z
    " fill="url(#gold-grad_dark)" />

    <!-- 5. Central Dark Imaging Aperture -->
    <rect x="32" y="35.5" width="25.5" height="24" rx="5" fill="#04080e" />
    <rect x="32" y="35.5" width="25.5" height="24" rx="5" stroke="#161f2c" stroke-width="0.75" fill="none" />

    <!-- 6. Four Optical Focus Reticle Brackets (Glowing Amber Gold) -->
    <path d="M 37.5 42.5 H 41.5 M 37.5 42.5 V 46.5" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 52 42.5 H 48 M 52 42.5 V 46.5" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 37.5 53.5 H 41.5 M 37.5 53.5 V 49.5" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 52 53.5 H 48 M 52 53.5 V 49.5" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 7. Abstract Forensic Image: Faceted Mountain Landscape -->
    <polygon points="37.5,54 42.5,49 47.5,54" fill="#475569" />
    <polygon points="42.5,54 47.5,47 47.5,54" fill="url(#mtn-face-shadow_dark)" />
    <polygon points="47.5,47 54,54 47.5,54" fill="url(#mtn-face-light_dark)" />

    <!-- 8. Three Detached Golden Pixel Fragments (Upper-Right Stair) -->
    <rect x="60.2" y="42.2" width="5.6" height="5.6" rx="1.3" fill="url(#pixel-grad_dark)" />
    <rect x="66.8" y="35.2" width="5.6" height="5.6" rx="1.3" fill="url(#pixel-grad_dark)" />
    <rect x="73.5" y="28.5" width="6.2" height="6.2" rx="1.4" fill="url(#pixel-grad_dark)" />
  
  </g>
</svg>